[project]
name = "cinebox"
version = "0.2.0"
description = "Terminal tool to search, stream, and download movies & TV shows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "movie",
    "streaming",
    "hls",
    "mpv",
    "vlc",
    "imdb",
    "cli",
    "terminal",
    "tv",
    "video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Terminals",
]
authors = [
    { name = "Hossam Gamal", email = "hosamgamal33345@gmail.com" }
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
discord = ["pypresence>=4.5"]

[project.scripts]
cinebox = "cinebox:main"

[project.urls]
Homepage = "https://github.com/hosam00/cinebox"
Repository = "https://github.com/hosam00/cinebox"
Issues = "https://github.com/hosam00/cinebox/issues"
Documentation = "https://github.com/hosam00/cinebox#readme"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.coverage.run]
source = ["src/cinebox"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
