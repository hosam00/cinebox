name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for PyPI trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cinebox/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --group dev --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'from importlib.metadata import version; print(version("cinebox"))')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package version $version" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke-test built wheel
        run: |
          uv venv /tmp/cinebox-release-venv
          uv pip install --python /tmp/cinebox-release-venv/bin/python dist/*.whl
          /tmp/cinebox-release-venv/bin/cinebox --version
          /tmp/cinebox-release-venv/bin/cinebox --help >/dev/null

      - name: Publish to PyPI (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verify-metadata: true
